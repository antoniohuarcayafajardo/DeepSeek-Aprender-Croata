<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>Croata · 3 minutos</title>
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:#f6f4ef;color:#17202a;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.45;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    position:sticky;top:0;z-index:5;
    background:rgba(246,244,239,.97);backdrop-filter:blur(10px);
    border-bottom:1px solid #e6e1d7;
    padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  }
  header::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:repeating-linear-gradient(90deg,#b3122c 0 12px,#fff 12px 24px);
  }
  .brand{font-weight:700;font-size:15px;letter-spacing:.1px;margin-top:6px}
  .brand b{color:#b3122c}
  .ver{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;
    color:#8a8273;background:#efeae1;border-radius:6px;padding:1px 5px;margin-left:4px;
    vertical-align:1px;
  }
  .sub{margin:4px 0 0;font-size:12px;color:#6b7280}

  main{max-width:640px;margin:0 auto;padding:14px 16px 40px}

  details.clase{
    background:#fff;border:1px solid #e6e1d7;border-radius:16px;
    margin-bottom:12px;overflow:hidden;
  }
  details.clase>summary{
    list-style:none;display:flex;align-items:center;gap:10px;
    padding:14px;font-weight:650;font-size:16px;cursor:pointer;
  }
  details.clase>summary::-webkit-details-marker{display:none}
  .num{
    flex:none;width:26px;height:26px;border-radius:8px;background:#12496e;color:#fff;
    display:grid;place-items:center;font-size:13px;font-weight:700;
  }
  .tit{flex:1;min-width:0}
  details[open]>summary{border-bottom:1px solid #eee9df}
  .cuerpo{padding:4px 14px 16px}
  .obj{color:#6b7280;font-size:14px;margin:10px 0 2px}

  h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6b7280;margin:16px 0 4px}

  .item{padding:10px 0;border-bottom:1px solid #f1ece2}
  .item:last-child{border-bottom:0}

  /* --- imagen + animación de cada palabra --- */
  details.vis{display:block}
  details.vis>summary{
    list-style:none;display:flex;align-items:center;gap:12px;
    cursor:pointer;padding:2px 0;
  }
  details.vis>summary::-webkit-details-marker{display:none}
  .mini{
    position:relative;flex:none;width:54px;height:54px;border-radius:16px;
    background:linear-gradient(160deg,#fff7e8,#efe6d5);
    border:1px solid #e8e0cf;
    display:grid;place-items:center;font-size:29px;line-height:1;
    box-shadow:0 2px 0 rgba(0,0,0,.03);
  }
  .mini::after{
    content:"✨";position:absolute;right:-6px;top:-7px;
    font-size:12px;line-height:1;padding:1px 2px;border-radius:8px;
    background:#fff;border:1px solid #e8e0cf;
  }
  details.vis[open] .mini{
    background:linear-gradient(160deg,#e9f2f9,#d6e5f2);
    border-color:#c6d9e9;
  }
  .txt{flex:1;min-width:0}
  .hr{display:block;font-size:19px;font-weight:650;letter-spacing:.1px}
  .es{display:block;font-size:13px;color:#6b7280;margin-top:2px}

  .escena{
    position:relative;height:156px;margin:10px 0 2px;
    border-radius:16px;overflow:hidden;
    border:1px solid #eee7da;
    background:
      radial-gradient(circle at 50% 42%, #fffdf7 0%, #f7f1e4 62%, #efe7d7 100%);
    display:grid;place-items:center;
  }
  .escena .g{
    font-size:82px;line-height:1;
    filter:drop-shadow(0 10px 10px rgba(70,50,20,.18));
    animation:aparecer .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  .escena .p{
    position:absolute;font-size:18px;opacity:0;
    animation:brillo 2.6s ease-in-out infinite;
  }
  .p1{left:22%;top:32%}
  .p2{right:22%;top:26%;animation-delay:.9s}

  @keyframes aparecer{from{transform:scale(.25) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
  @keyframes brillo{0%,100%{opacity:0;transform:scale(.5) translateY(6px)}50%{opacity:.95;transform:scale(1) translateY(-4px)}}
  @keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
  @keyframes flotar{0%,100%{transform:translateY(-7px)}50%{transform:translateY(7px)}}
  @keyframes menear{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  @keyframes rebotar{
    0%,100%{transform:translateY(0) scale(1,1)}
    40%{transform:translateY(-26px) scale(.94,1.06)}
    55%{transform:translateY(-26px) scale(1.06,.94)}
    85%{transform:translateY(0) scale(1.08,.92)}
  }
  @keyframes nadar{0%,100%{transform:translateX(-30px) rotate(-7deg)}50%{transform:translateX(30px) rotate(7deg)}}
  @keyframes girar{to{transform:rotate(360deg)}}
  @keyframes deslizar{0%{transform:translateX(-72px)}70%{transform:translateX(8px)}100%{transform:translateX(72px)}}
  @keyframes temblar{
    0%,100%{transform:translateX(0) rotate(0)}
    25%{transform:translateX(-5px) rotate(-3deg)}
    75%{transform:translateX(5px) rotate(3deg)}
  }
  @keyframes vapor{0%{opacity:0;transform:translateY(8px) scale(.6)}30%{opacity:.9}100%{opacity:0;transform:translateY(-54px) scale(1.3)}}

  .a-latir .g{animation:aparecer .5s both, latir 1.8s ease-in-out .5s infinite}
  .a-flotar .g{animation:aparecer .5s both, flotar 2.6s ease-in-out .5s infinite}
  .a-menear .g{animation:aparecer .5s both, menear 1.6s ease-in-out .5s infinite}
  .a-rebotar .g{animation:aparecer .5s both, rebotar 1.5s cubic-bezier(.5,0,.5,1) .5s infinite}
  .a-nadar .g{animation:aparecer .5s both, nadar 3s ease-in-out .5s infinite}
  .a-girar .g{animation:aparecer .5s both, girar 4s linear .5s infinite}
  .a-deslizar .g{animation:aparecer .5s both, deslizar 2.6s ease-in-out .5s infinite}
  .a-temblar .g{animation:aparecer .5s both, temblar 1.4s ease-in-out .5s infinite}
  .a-vapor .g{animation:aparecer .5s both, flotar 2.8s ease-in-out .5s infinite}
  .a-vapor .p{animation:vapor 2.6s ease-out infinite}

  audio{width:100%;margin-top:10px;display:block}

  .preg{font-size:15px;margin:8px 0 2px}
  .pie{color:#9a9384;font-size:12px;text-align:center;margin:24px 0 0}

  @media (prefers-reduced-motion: reduce){
    .escena .g,.escena .p{animation:none !important}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><b>■</b> Croata · 3 minutos <span class="ver">v4</span></div>
  <p class="sub">Toca la imagen de una palabra para ver su animación. Toca ▶ para oírla.</p>
</header>

<main>
<!--CLASES-->
<p class="pie">v4 · __TOTAL__ clases · audio incluido</p>
</main>

</body>
</html>
